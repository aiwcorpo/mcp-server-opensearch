# Base configuration is the production one: mTLS from the gateway, internal JWT, jti store in Redis.
# Everything that differs per environment comes from environment variables (README, "Konfiguracja").
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the remaining development
# relaxations come from TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-opensearch
  data:
    redis:
      host: ${MCP_REDIS_HOST:localhost}
      port: ${MCP_REDIS_PORT:6379}
      username: ${MCP_REDIS_USER:mcp-opensearch}
      password: ${MCP_REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: mcp-opensearch
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      server-id: mcp-opensearch
      internal-jwt:
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}
      # Key of the cursors of search_logs and list_indices (Base64, at least 32 bytes). Every instance must have the
      # same one; without it each instance draws its own and a cursor from one is refused by the other.
      paging:
        cursor-key: ${MCP_CURSOR_KEY:}
      # The signed policy bundle (C7), the same one the gateway evaluates. The server does not start without a first
      # bundle, and state-dir keeps the last accepted revision across restarts so an older signed bundle is refused.
      policy:
        main:
          url: ${MCP_POLICY_URL:}
          key-id: ${MCP_POLICY_KEY_ID:}
          public-key-file: ${MCP_POLICY_PUBLIC_KEY_FILE:}
        state-dir: ${MCP_POLICY_STATE_DIR:}
      # Description of this server for the registry (GET /mcp-manifest, C6); the tool entries come from the code.
      manifest:
        version: '@project.version@'
        internal-url: ${MCP_INTERNAL_URL:}
        # The first type is the default of the system (context.credentialType in Cedar): the broker exchanges the user's
        # token for one OpenSearch accepts (Bearer). A request whose X-MCP-Credential-Type is outside the list is refused.
        # Fixed on purpose: CredentialTypeGuard refuses to start with any other value (e.g. one set from the environment).
        accepted-credential-types: token-exchange

opensearch:
  backend:
    base-url: ${MCP_OPENSEARCH_URL:}
    ssl-bundle: ${MCP_OPENSEARCH_SSL_BUNDLE:}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 1MB
    # Plain http outside 'dev' only for the mocks of mcp-platform-dev; never in a real deployment.
    allow-plain-http: ${MCP_OPENSEARCH_ALLOW_PLAIN_HTTP:false}
    # The version probe (GET /) is anonymous: the server holds no credential. A cluster with the Security plugin answers
    # 401 and the server runs in degraded mode (get_backend_info). true = the operator states that the cluster is
    # OpenSearch 2.x or 3.x and the server runs with the full feature set.
    assume-tested-version: ${MCP_OPENSEARCH_ASSUME_TESTED_VERSION:false}
  # Index prefixes the server may touch at all (comma-separated). Each call is narrowed further to what the
  # caller's mcp-opensearch-idx-* groups grant (QueryScope); the server does not start without at least one.
  # Classification of indices for the policy (OpenSearch has no tags), e.g.
  #   index-tags:
  #     - prefix: logs-team-a-hr
  #       tags: [restricted]
  # or in the environment OPENSEARCH_SCOPE_INDEXTAGS_0_PREFIX / OPENSEARCH_SCOPE_INDEXTAGS_0_TAGS (README).
  scope:
    allowed-index-prefixes: ${MCP_OPENSEARCH_INDEX_PREFIXES:}
  search:
    timestamp-field: ${MCP_OPENSEARCH_TIMESTAMP_FIELD:@timestamp}
    query-fields: ${MCP_OPENSEARCH_QUERY_FIELDS:message}
    result-fields: ${MCP_OPENSEARCH_RESULT_FIELDS:@timestamp,message,log.level,service.name,host.name}
    level-field: ${MCP_OPENSEARCH_LEVEL_FIELD:log.level}
    service-field: ${MCP_OPENSEARCH_SERVICE_FIELD:service.name}
    host-field: ${MCP_OPENSEARCH_HOST_FIELD:host.name}
    max-range: ${MCP_OPENSEARCH_MAX_RANGE:7d}
    # Field with a different value in every document (a keyword or a number), the last sort key of search_logs. Empty
    # = no paging. Not _id: it has no doc values and is unique only within an index.
    tiebreaker-field: ${MCP_OPENSEARCH_TIEBREAKER_FIELD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-opensearch

---
# TLS outside 'dev'. The server ends mTLS itself: the gateway must present a certificate of the internal CA
# (the starter also checks its CN), and the gateway checks this server's SAN mcp-opensearch.internal.
spring:
  config:
    activate:
      on-profile: "!dev"
  ssl:
    bundle:
      jks:
        mcp-server:
          keystore:
            location: file:${MCP_TLS_KEYSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
        mcp-internal-ca:
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
server:
  ssl:
    bundle: mcp-server
    client-auth: need
aiwcorpo:
  mcp:
    platform:
      internal-jwt:
        jwks-ssl-bundle: mcp-internal-ca
